<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript DOM Tasks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    section {
      margin-bottom: 30px;
    }

    input {
      display: block;
      margin: 8px 0;
      padding: 8px;
    }

    button {
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h1 id="title">Hello World</h1>

  <section>
    <h2> Paragraph Styles</h2>
    <p class="description">This is the first paragraph.</p>
    <p class="description">This is the second paragraph.</p>
    <p class="description">This is the third paragraph.</p>
  </section>

  
 

  <section>
    <h2>Input Properties</h2>
    <input id="username" type="text" placeholder="Username">
    <input id="email" type="email" placeholder="Email">
    <button id="submitButton" type="button">Submit</button>
  </section>

  <section>
    <h2> Multiple Elements</h2>
    <h2 class="technology">First heading</h2>
    <h2 class="technology">Second heading</h2>
    <h2 class="technology">Third heading</h2>
    <h2 class="technology">Fourth heading</h2>
    <h2 class="technology">Fifth heading</h2>
  </section>

  <script src="./Asset/js/script.js"></script>
</body>
</html>
