<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Nike</title>
</head>

<body class="m-0 p-0">

    
    <header class="bg-white">

        
        <div class="flex justify-end items-center gap-4 px-8 py-2 text-sm">
            <a href="#" class="hover:underline">Help</a>
            <span>|</span>
            <a href="#" class="hover:underline">Sign Up</a>
            <span>|</span>
            <a href="#" class="hover:underline">Log In</a>
        </div>


        <!-- Main Navigation -->
        <nav class="flex items-center justify-between px-8 py-4 bg-white">

            <!-- Nike Logo -->
            <div class="w-24">
                <img 
                    src="../Day 2/Asset/image/nike-logo-192x192.svg"
                    alt="Nike Logo"
                    class="w-full h-auto"
                >
            </div>


            <!-- Menu -->
            <div class="flex items-center gap-8 text-sm font-medium">

                <a href="#" class="hover:underline">
                    New & Featured
                </a>

                <a href="#" class="hover:underline">
                    Men
                </a>

                <a href="#" class="hover:underline">
                    Women
                </a>

                <a href="#" class="hover:underline">
                    Kids
                </a>

                <a href="#" class="hover:underline">
                    Jordan
                </a>

            </div>


            <!-- Search -->
            <div>
                <input
                    type="text"
                    placeholder="Search..."
                    class="w-64 bg-gray-100 px-4 py-2 rounded-full outline-none"
                >
            </div>

        </nav>

    </header>


    <!-- OFFER -->
    <div class="bg-gray-100 text-center py-3">

        <a href="#" class="text-sm">
            Enjoy 15% Off On The Nike App. Use: APP15
        </a>

        <p class="text-sm mt-1">
            Download Now T&Cs
        </p>

    </div>


    <!-- FEATURED TITLE -->
    <div class="px-6 py-6">

        <a href="#" class="text-lg font-medium">
            Featured
        </a>

    </div>


    <!-- FEATURED IMAGES -->
    <div class="flex gap-4 px-6 overflow-hidden">

        <div class="w-1/2">
            <img
                src="Asset/image/bcdf9b37-5925-45f6-8bf6-54deb48fdb66.oneavif"
                alt="Nike Featured"
                class="w-full h-[500px] object-cover"
            >
        </div>

        <div class="w-1/2">
            <img
                src="Asset/image/c93ec7e2-b0c2-4fe3-888c-261a605c2973.twoavif"
                alt="Nike Featured"
                class="w-full h-[500px] object-cover"
            >
        </div>

    </div>


    <!-- TRENDING -->
    <div class="px-6 py-8">

        <a href="#" class="text-lg font-medium">
            Trending
        </a>


        <!-- Trending Images -->
        <div class="flex gap-5 mt-5 overflow-hidden">

            <div class="w-1/3">
                <img
                    src="Asset/image/36bedff2-99ce-4732-80b8-6a6610971abethree.avif"
                    alt="Nike Trending"
                    class="w-full h-[450px] object-cover"
                >
            </div>

            <div class="w-1/3">
                <img
                    src="Asset/image/07ab9911-87a1-409f-aa34-d021f29049e8four.avif"
                    alt="Nike Trending"
                    class="w-full h-[450px] object-cover"
                >
            </div>

            <div class="w-1/3">
                <img
                    src="Asset/image/d0b44079-0ac6-44a9-a033-de5e4d82d086five.avif"
                    alt="Nike Trending"
                    class="w-full h-[450px] object-cover"
                >
            </div>

        </div>

    </div>

</body>
</html>
