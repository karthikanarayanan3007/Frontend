<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Card Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="container">

        <!-- Card 1 -->
        <article class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72"
                     alt="Business">
            </div>

            <div class="content">
                <span class="number">01</span>
                <h2>Business</h2>
                <p>Explore our business services and solutions.</p>
                <button>Learn More</button>
            </div>
        </article>


        <!-- Card 2 -->
        <article class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72"
                     alt="Team">
            </div>

            <div class="content">
                <span class="number">02</span>
                <h2>Our Team</h2>
                <p>Meet our professional and creative team.</p>
                <button>View Team</button>
            </div>
        </article>


        <!-- Card 3 -->
        <article class="card">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71"
                     alt="Analytics">
            </div>

            <div class="content">
                <span class="number">03</span>
                <h2>Analytics</h2>
                <p>Check important data and business performance.</p>
                <button>View Data</button>
            </div>
        </article>

    </section>

</body>
</html>
   

    
</body>
</html>
